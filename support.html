<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サポート・お問い合わせ | クレカナビ</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; line-height: 1.8; color: #1a1a1a; }
  h1 { font-size: 22px; margin-bottom: 12px; }
  p.lead { color: #555; font-size: 14px; margin-bottom: 28px; }
  ul { padding-left: 0; list-style: none; }
  li { margin-bottom: 14px; }
  button.item { display: block; width: 100%; text-align: left; padding: 16px 18px; background: #f0f0f3; border: none; border-radius: 12px; color: #1a1a1a; font: inherit; cursor: pointer; }
  button.item:hover { background: #e4e4e9; }
  button.item strong { display: block; font-size: 15px; margin-bottom: 4px; }
  button.item span { font-size: 13px; color: #666; }
  .email-note { margin-top: 32px; font-size: 12px; color: #888; text-align: center; }
  a.back { display: inline-block; margin-bottom: 24px; color: #555; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
  <a class="back" href="./index.html">&larr; トップに戻る</a>
  <h1>サポート・お問い合わせ</h1>
  <p class="lead">ご連絡内容を選択してください。メールアプリが起動します。</p>

  <ul>
    <li>
      <button class="item" type="button" data-subject="カード追加のご依頼">
        <strong>カード追加のご依頼</strong>
        <span>掲載を希望するカード情報をお送りください</span>
      </button>
    </li>
    <li>
      <button class="item" type="button" data-subject="不具合の報告">
        <strong>不具合の報告</strong>
        <span>発生した問題の詳細をお知らせください</span>
      </button>
    </li>
    <li>
      <button class="item" type="button" data-subject="アプリ改善のご提案">
        <strong>アプリ改善のご提案</strong>
        <span>ご意見・ご要望をお聞かせください</span>
      </button>
    </li>
  </ul>

  <p class="email-note">送信先: todakento.work@gmail.com</p>

  <script>
    // Plain <a href="mailto:..."> siblings were reported to sometimes launch more
    // than one compose window on some devices. Using buttons that set
    // window.location exactly once per click avoids any ambiguity from default
    // anchor navigation behavior.
    document.querySelectorAll('button.item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var subject = encodeURIComponent(btn.dataset.subject);
        window.location.href = 'mailto:todakento.work@gmail.com?subject=' + subject;
      });
    });
  </script>
</body>
</html>
